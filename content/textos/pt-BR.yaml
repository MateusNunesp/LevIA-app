# Textos aprovados da LevIA (pt-BR). Tudo o que o funcionário lê vem daqui (regra 5).
# RASCUNHO: TODO(D5) revisar todo o conteúdo. Alvo de legibilidade: até 8º ano (M12).
# {chaves} são trocadas por valores estruturados; nunca por texto livre de IA.
versao: 1
status_revisao: precisa_de_revisao
revisado_por: null
revisado_em: null
textos:
  # ---- abertura e consentimento ----
  aviso.fixo: "A LevIA não é atendimento médico nem serviço de emergência. Em emergência, ligue 192."
  consentimento.triagem.titulo: "Antes de começar"
  consentimento.triagem.texto: "Para ajudar com a sua dor, a LevIA vai fazer algumas perguntas. Suas respostas são suas. Você pode apagar tudo quando quiser, na aba Você."
  consentimento.rh.explicacao: "O RH vê só números do time, como quantas pessoas usam o app. O RH nunca vê o seu nome, as suas respostas nem a sua dor. Grupos com menos de 10 pessoas ficam escondidos."
  consentimento.ritmo.texto: "O Ritmo mostra a constância da sua equipe nos exercícios. Sua equipe vê só o seu apelido, sem pontos seus. Você pode sair quando quiser."
  consentimento.aceito: "Aceito"

  # ---- roteiro ----
  pergunta.regiao: "Oi! Eu sou a LevIA. Toque no desenho onde dói. Se preferir, escreva ou fale o lugar."
  pergunta.regiao.repergunta: "Não entendi o lugar. Toque no desenho ou escreva, por exemplo: lombar, pescoço ou ombro."
  pergunta.duracao: "Faz quanto tempo que dói?"
  pergunta.duracao.repergunta: "Me diga em dias ou semanas. Por exemplo: 3 dias, ou 2 semanas."
  pergunta.dor_nota: "De 0 a 10, quanto dói agora?"
  pergunta.dor_nota.repergunta: "Me diga só um número de 0 a 10. Zero é sem dor. Dez é a pior dor."
  alerta.repergunta.intro: "Quero ter certeza. Vou perguntar uma coisa de cada vez."
  alerta.repergunta.sim_nao: "Preciso de um sim ou não bem claro."
  alerta.mencao: "Você falou uma coisa que importa. Vou perguntar melhor."

  alerta.cardiaco: "A dor vem junto com aperto no peito, falta de ar ou suor frio? Me conte, ou escreva 'nenhuma'."
  alerta.neuro_lombar: "Você tem dificuldade para fazer xixi ou cocô, dormência na virilha ou fraqueza nas pernas que está piorando? Me conte qual, ou escreva 'nenhuma'."
  alerta.neuro_pescoco: "Você tem fraqueza ou dormência nos dois braços, falta de equilíbrio ao andar, mãos desajeitadas, tontura, visão dupla, fala enrolada ou dificuldade para engolir? Me conte qual, ou escreva 'nenhuma'."
  alerta.sistemico_coluna: "Você já teve câncer, perdeu peso sem saber por quê, está com febre, usa corticoide há muito tempo ou tem osteoporose? Me conte qual, ou escreva 'nenhuma'."
  alerta.sistemico_geral: "Você já teve câncer, perdeu peso sem saber por quê ou está com febre? Me conte qual, ou escreva 'nenhuma'."
  alerta.mecanico_lombar: "A dor começou depois de uma queda ou batida forte, fica forte à noite sem mudar de jeito nenhum, piora rápido, ou não deixa você apoiar ou mexer? Me conte qual, ou escreva 'nenhuma'."
  alerta.mecanico_geral: "A dor começou depois de uma queda ou batida forte, piora rápido, ou não deixa você apoiar ou mexer? Me conte qual, ou escreva 'nenhuma'."

  alerta.unica.peito: "Você sente aperto no peito, falta de ar ou suor frio junto com a dor? Responda sim ou não."
  alerta.unica.urina: "Você tem dificuldade para fazer xixi ou cocô, ou perdeu o controle deles? Responda sim ou não."
  alerta.unica.sela: "Você sente dormência na virilha ou entre as pernas? Responda sim ou não."
  alerta.unica.forca_pernas: "Você sente fraqueza nas pernas que está piorando? Responda sim ou não."
  alerta.unica.bracos_ambos: "Você sente fraqueza ou dormência nos dois braços? Responda sim ou não."
  alerta.unica.equilibrio_maos: "Você está sem equilíbrio para andar ou com as mãos desajeitadas? Responda sim ou não."
  alerta.unica.neuro_central: "Você tem tontura, visão dupla, fala enrolada ou dificuldade para engolir? Responda sim ou não."
  alerta.unica.cancer: "Você já teve câncer? Responda sim ou não."
  alerta.unica.peso: "Você perdeu peso sem saber por quê? Responda sim ou não."
  alerta.unica.febre: "Você está com febre? Responda sim ou não."
  alerta.unica.corticoide: "Você usa corticoide há muito tempo ou tem osteoporose? Responda sim ou não."
  alerta.unica.trauma: "A dor começou depois de uma queda ou batida forte? Responda sim ou não."
  alerta.unica.noturna: "A dor fica forte à noite e não muda quando você troca de posição? Responda sim ou não."
  alerta.unica.piora_rapida: "A dor está piorando rápido? Responda sim ou não."
  alerta.unica.nao_mexe: "A dor impede você de apoiar ou mexer o lugar que dói? Responda sim ou não."

  # STarT Back — TODO(D5): conferir palavra por palavra com a versão brasileira validada
  # (Pilz et al., 2014) e com a licença da Keele. {dor} vira "dor nas costas" ou "dor".
  startback.intro: "Agora são 9 frases rápidas sobre as duas últimas semanas. Responda se concorda ou discorda."
  startback.1: "Nas duas últimas semanas, a minha {dor} se espalhou pelas pernas. Você concorda ou discorda?"
  startback.2: "Nas duas últimas semanas, eu tive dor no ombro ou na nuca. Você concorda ou discorda?"
  startback.3: "Eu só andei distâncias curtas por causa da minha {dor}. Você concorda ou discorda?"
  startback.4: "Nas duas últimas semanas, eu me vesti mais devagar por causa da {dor}. Você concorda ou discorda?"
  startback.5: "Para alguém como eu, não é seguro ser ativo fisicamente. Você concorda ou discorda?"
  startback.6: "Pensei muitas vezes em coisas que me preocupam. Você concorda ou discorda?"
  startback.7: "Sinto que a minha dor é terrível e que nunca vai melhorar. Você concorda ou discorda?"
  startback.8: "Em geral, não tenho gostado das coisas como antes. Você concorda ou discorda?"
  startback.9: "Nas duas últimas semanas, quanto a sua {dor} incomodou? Nada, pouco, médio, muito ou demais?"
  startback.repergunta: "Me responda com 'concordo' ou 'discordo'."
  startback.9.repergunta: "Me responda com uma destas: nada, pouco, médio, muito ou demais."

  achado.peito: "aperto no peito, falta de ar ou suor frio"
  achado.urina: "mudança no xixi ou no cocô"
  achado.sela: "dormência na virilha"
  achado.forca_pernas: "fraqueza nas pernas"
  achado.bracos_ambos: "fraqueza ou dormência nos dois braços"
  achado.equilibrio_maos: "falta de equilíbrio ou mãos desajeitadas"
  achado.neuro_central: "tontura, visão dupla, fala enrolada ou dificuldade para engolir"
  achado.cancer: "já teve câncer"
  achado.peso: "perda de peso sem motivo"
  achado.febre: "febre"
  achado.corticoide: "corticoide há muito tempo ou osteoporose"
  achado.trauma: "queda ou batida forte"
  achado.noturna: "dor forte à noite"
  achado.piora_rapida: "dor piorando rápido"
  achado.nao_mexe: "não consegue apoiar ou mexer"
  confirmacao.texto: "Entendi: dor {regioes} há {duracao}, nota {nota}. {alertas} Está certo?"
  confirmacao.sem_alerta: "Você não tem nenhum dos sinais que perguntei."
  confirmacao.com_alerta: "Você marcou: {lista}."
  confirmacao.o_que_mudar: "Tudo bem. Me conte o que está errado, com suas palavras."
  confirmacao.repergunta: "Está certo? Responda sim, ou me conte o que mudar."
  confirmacao.corrigido: "Pronto, corrigi."
  sessao.fim: "Se quiser falar de outra dor, escreva 'recomeçar'."
  nao_entendi: "Não entendi. Pode dizer de outro jeito?"

  # ---- saídas ----
  saida1.titulo: "Dá para cuidar em casa"
  saida1.texto: "Seu caso parece simples. Fique em movimento no dia a dia, do jeito que der. Separei exercícios leves para você. Se a dor aumentar, pare e me conte."
  saida1.checagem: "Vou te chamar para uma pergunta rápida em {data}."
  saida2.titulo: "Vale falar com um fisioterapeuta"
  saida2.texto: "Vale uma consulta por vídeo com um fisioterapeuta, pelo seu plano de saúde ou particular. Até lá, eu não vou passar exercícios. Siga o que o fisioterapeuta disser."
  saida3.titulo: "Procure atendimento presencial"
  saida3.texto: "Procure atendimento presencial. Vá a um lugar onde alguém possa ver você de perto. Até lá, não vou passar exercícios."
  saida3.urgente: "Vá hoje a um pronto atendimento."
  saida3.emergencia: "Em emergência, ligue 192."
  resumo.leve: "Leve este resumo, se quiser."
  resumo.texto: "Este é o resumo das suas respostas. Ele fica só com você."
  exercicios.pausados: "Seus exercícios estão parados por agora. Siga o que o fisioterapeuta disser."

  # ---- porquê (R7): a regra em linguagem simples ----
  porque.saida3.peito: "Dor com aperto no peito, falta de ar ou suor é sinal de alerta. Isso precisa de ajuda na hora."
  porque.saida3.cauda_equina: "Mudança no xixi ou no cocô, dormência na virilha ou perna mais fraca são sinais de alerta. Eles precisam de exame hoje."
  porque.saida3.neuro_cervical: "Fraqueza nos dois braços, falta de equilíbrio ou mudança na fala ou na visão são sinais de alerta. Eles precisam de exame hoje."
  porque.saida3.trauma_coluna: "Dor na coluna depois de queda ou batida forte precisa de exame para ver se houve lesão."
  porque.saida3.sistemico: "Câncer no passado, perda de peso sem motivo ou febre junto com a dor pedem um exame hoje."
  porque.saida3.noturna: "Dor forte à noite que não muda com a posição pede um exame hoje."
  porque.saida3.fragilidade: "Quem usa corticoide há muito tempo ou tem osteoporose pode ter o osso mais fraco. Isso pede um exame hoje."
  porque.saida3.dor_forte: "Sua dor está muito forte. Por isso, é melhor alguém examinar você de perto."
  porque.saida3.trauma: "A dor começou depois de uma queda ou batida forte. Por isso, é melhor alguém examinar você de perto."
  porque.saida3.piora_rapida: "A dor está piorando rápido. Por isso, é melhor alguém examinar você de perto."
  porque.saida3.nao_mexe: "A dor impede você de apoiar ou mexer. Por isso, é melhor alguém examinar você de perto."
  porque.saida2.startback: "Suas respostas mostram que a dor está pesando na sua vida. Um fisioterapeuta pode ajudar mais que exercícios sozinhos."
  porque.saida2.semana1: "A dor piorou na primeira semana. Por isso, vale falar com um fisioterapeuta."
  porque.saida2.semana2: "A dor não melhorou o bastante em duas semanas. Por isso, vale falar com um fisioterapeuta."
  porque.saida2.semana4: "Depois de quatro semanas a dor ainda pesa. Por isso, vale falar com um fisioterapeuta."
  porque.saida2.semana6: "Depois de seis semanas você ainda não melhorou. Por isso, vale falar com um fisioterapeuta."
  porque.saida2.recorrencia: "Esta é a terceira vez em um ano que essa dor volta. Por isso, vale falar com um fisioterapeuta."
  porque.saida2.sem_regra: "Seu caso não se encaixa no cuidado em casa. Na dúvida, é melhor falar com um fisioterapeuta."
  porque.saida1.autocuidado: "Sua dor é leve, começou há pouco tempo e você não tem nenhum sinal de alerta. Casos assim costumam melhorar com movimento."

  # ---- checagens (D3) ----
  checagem.intro: "Oi! É a sua pergunta rápida da semana {semana}."
  checagem.nota: "De 0 a 10, quanto dói agora?"
  checagem.trabalho: "A dor atrapalha o seu trabalho? Responda sim ou não."
  checagem.trabalho.repergunta: "Responda sim ou não: a dor atrapalha o seu trabalho?"
  checagem.recuperado: "Você sente que já melhorou da dor? Responda sim ou não."
  checagem.confirmacao: "Entendi: nota {nota}, {trabalho}. {alertas} Está certo?"
  checagem.trabalho.sim: "atrapalha o trabalho"
  checagem.trabalho.nao: "não atrapalha o trabalho"
  checagem.continua: "Que bom. Siga com os exercícios. Vou te chamar de novo em {data}."
  checagem.fim: "Que bom! Seu acompanhamento terminou. Se a dor voltar, é só me chamar."
  notificacao.texto: "A LevIA tem uma pergunta rápida pra você"

  # ---- guardrails (R12) ----
  guardrail.diagnostico: "Eu não dou diagnóstico nem indico remédio. Quem pode fazer isso é um profissional de saúde. Vamos voltar às perguntas?"
  guardrail.profissional: "Eu não indico profissional nem clínica, e não marco consulta. Você pode procurar pelo seu plano de saúde ou particular. Vamos voltar às perguntas?"
  guardrail.exercicio_fora: "Eu só passo exercícios do meu catálogo, e só no final das perguntas. Vamos voltar às perguntas?"
  guardrail.contra_diretriz: "Eu não oriento repouso na cama, cinta nem exame de rotina. Ficar em movimento costuma ajudar mais. Vamos voltar às perguntas?"
  guardrail.fora_escopo: "Eu só ajudo com dor no corpo. Vamos voltar às perguntas?"
  guardrail.porque: "Eu explico o porquê no final, junto com o resultado."

  # ---- emergência (fora do escopo, mas perigoso) ----
  emergencia.cardiaca: "Dor no peito com falta de ar ou suor é uma emergência. Ligue agora para o SAMU, 192."
  emergencia.avc: "Rosto torto, fala enrolada ou fraqueza de um lado do corpo é uma emergência. Ligue agora para o SAMU, 192."
  emergencia.autolesao: "Sinto muito que você esteja passando por isso. Você não precisa passar por isso sem ajuda. Ligue para o CVV, 188, a qualquer hora. Se estiver em perigo agora, ligue 192."
  emergencia.recomecar: "Quando quiser, escreva 'recomeçar'."

  # ---- estados ----
  estado.offline: "Sem conexão. Sua mensagem vai assim que a internet voltar."
  estado.ia_off: "Agora eu entendo melhor respostas curtas. Use poucas palavras, por favor."
  estado.voz_off: "A voz não está funcionando agora. Você pode escrever."
  estado.voz_nuvem: "Neste celular, a voz passa pelo serviço do sistema do celular para virar texto. Se preferir, escreva."
  revisao.faixa: "Conteúdo em revisão"
